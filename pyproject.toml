[project]
name = "chatgpt-oracle"
version = "0.1.0"
description = "A local asynchronous MCP broker for delegating research to a logged-in ChatGPT Web browser profile."
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.30.0",
  "playwright==1.58.0",
]

[project.scripts]
chatgpt-oracle = "chatgpt_oracle.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
